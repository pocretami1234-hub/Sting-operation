<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sting Operation: Cyber Escape</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background: #020205; color: #00ffcc; overflow: hidden; width: 100vw; height: 100vh; position: relative; }
        
        #canvas-game { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* PANTALLA DE CONTROL BIOMÉTRICO CON ANIMACIÓN */
        #boot-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #020205; z-index: 9999999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        #btn-boot {
            padding: 20px 40px; font-size: 18px; font-weight: bold; background: #ff0055;
            color: white; border: none; border-radius: 4px; cursor: pointer;
            box-shadow: 0 0 20px #ff0055; text-transform: uppercase; margin-top: 20px;
        }

        /* Contenedor de la persecución arcade */
        #chase-container {
            width: 300px; height: 50px; position: relative; margin-top: 25px;
            overflow: hidden; border-bottom: 2px dashed #ff0055; display: none;
        }
        #chase-actors {
            position: absolute; white-space: nowrap; font-size: 24px;
            animation: arcadeChase 1.5s linear infinite; left: -100px;
        }
        @keyframes arcadeChase { 0% { left: -100px; } 100% { left: 320px; } }

        /* Menú de Selección Táctico */
        #team-select {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #05050f; border: 2px solid #ff0055; padding: 40px;
            border-radius: 8px; text-align: center; z-index: 99999; box-shadow: 0 0 30px rgba(255,0,85,0.4);
            width: 450px; display: none;
        }
        .team-btn {
            padding: 15px 30px; font-size: 16px; font-weight: bold; margin: 15px;
            border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase;
        }
        #btn-fugitive { background: #ffcc00; color: #000; box-shadow: 0 0 15px #ffcc00; }
        #btn-agent { background: #0055ff; color: #fff; box-shadow: 0 0 15px #0055ff; }

        /* HUD Superior */
        #hud {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(5, 5, 10, 0.95); padding: 12px; border-radius: 4px;
            font-size: 13px; border: 2px solid #ff0055; line-height: 1.5; min-width: 240px; display: none;
        }
        .bar { background: #111; border-radius: 2px; height: 12px; width: 100px; display: inline-block; overflow: hidden; border: 1px solid #333; vertical-align: middle; }
        #hp-fill { background: #ff0055; height: 100%; width: 100%; }

        #leaderboard {
            position: absolute; top: 10px; right: 10px; z-index: 100;
            background: rgba(5, 5, 10, 0.95); padding: 12px; border-radius: 4px;
            font-size: 12px; border: 2px solid #00ffcc; width: 220px; display: none;
        }
        .leader-row { display: flex; justify-content: space-between; margin: 4px 0; }
    </style>
    <script src="https://socket.io"></script>
</head>
<body>

    <div id="boot-screen">
        <h1 style="color: #ff0055; font-size: 24px; letter-spacing: 2px; text-shadow: 0 0 10px #ff0055;">🤖 AUTENTICACIÓN BIOMÉTRICA</h1>
        <p id="boot-text" style="color: #888; font-size: 12px; margin-top: 10px;">Presiona el botón para sincronizar los módulos del mapa urbano.</p>
        <button id="btn-boot">Sincronizar Canal</button>
        
        <div id="chase-container">
            <div id="chase-actors">🏃‍♂️ 👮‍♂️</div>
        </div>
    </div>

    <div id="team-select">
        <h2 style="color: #ff0055; margin-bottom: 20px; letter-spacing: 2px;">SELECCIÓN DE OPERATIVO</h2>
        <button id="btn-fugitive" class="team-btn">Fugitivo (Escapa y Roba)</button>
        <button id="btn-agent" class="team-btn">Agente (Defiende y Caza)</button>
        <p id="net-status" style="font-size: 10px; margin-top: 20px; color: #ff0055;">Buscando señal de red pública...</p>
    </div>
    <div id="hud">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-weight:bold;">
            <span style="color:#ffcc00;">🏃‍♂️ Fugs: <span id="count-fugs">0</span></span>
            <span style="color:#0055ff;">👮‍♂️ Agents: <span id="count-agents">0</span></span>
        </div>
        <hr style="border-color:#333; margin:4px 0;">
        <div>Operativo: <span id="txt-name" style="color:#fff;">Anon_User</span></div>
        <div>Rol: <span id="txt-role" style="color:#ffcc00;">SELECCIONANDO...</span></div>
        <div>Integridad: <div class="bar"><div id="hp-fill"></div></div></div>
    </div>

    <div id="leaderboard">
        <div style="font-weight:bold; color:#00ffcc; text-align:center; margin-bottom:8px; border-bottom:1px solid #00ffcc;">NEXO DE OPERATIVOS</div>
        <div id="leaderboard-content"></div>
    </div>

    <canvas id="canvas-game"></canvas>

    <script>
        // Conexión directa y protegida al servidor backend
        const socket = io("https://onrender.com");
        const canvas = document.getElementById('canvas-game');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let myId = null;
        let gameStarted = false;
        let bootScreenActive = true;

        let localPlayer = { name: "Operativo", x: 250, y: 250, angle: 0, hp: 100, cash: 0, role: 'PENDING', weapon: 'NONE', isArrestedOnGround: false };
        let remotePlayers = {};
        const MAP_SIZE = 4000;
        
        const zones = {
            prision: { x: 100, y: 100, w: 400, h: 400, color: '#0d0d1a', name: "Complejo de Retención Alfa" },
            comisaria: { x: 1800, y: 500, w: 450, h: 350, color: '#051026', name: "Estación de Comando" }
        };

        function playTone(freq, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // 🚨 SOLUCIÓN AL BLOQUEO DE CLICS (Un solo .style)
        document.getElementById('btn-boot').onclick = function() {
            playTone(587, 0.1);
            document.getElementById('boot-text').innerText = "⚡ PROCESANDO MÓDULOS BIOMÉTRICOS...";
            document.getElementById('btn-boot').style.display = "none"; // Corrección de sintaxis limpia
            document.getElementById('chase-container').style.display = "block";
            
            setTimeout(() => {
                playTone(880, 0.15);
                bootScreenActive = false;
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('team-select').style.display = 'block';
            }, 1500);
        };

        const keys = {}; let mouseX = 0, mouseY = 0;
        window.addEventListener('keydown', e => { if (gameStarted) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { if (gameStarted) keys[e.key.toLowerCase()] = false; });
        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

        document.getElementById('btn-fugitive').onclick = function() { selectTeam('FUGITIVE', 250, 250); };
        document.getElementById('btn-agent').onclick = function() { selectTeam('AGENT', 1950, 650); };

        function selectTeam(team, spawnX, spawnY) {
            localPlayer.role = team; localPlayer.x = spawnX; localPlayer.y = spawnY;
            localPlayer.name = team === 'AGENT' ? "Agente_" + Math.floor(Math.random()*900+100) : "Fugitivo_" + Math.floor(Math.random()*900+100);
            
            // Forzar encendido de dimensiones del Canvas antes de arrancar
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            gameStarted = true;
            document.getElementById('team-select').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('leaderboard').style.display = 'block';
            document.getElementById('txt-name').innerText = localPlayer.name;
            document.getElementById('txt-role').innerText = team;
            
            socket.emit('joinTeam', { role: localPlayer.role, name: localPlayer.name, x: localPlayer.x, y: localPlayer.y });
        }

        socket.on('connect', () => {
            document.getElementById('net-status').innerText = "✅ Canal de Red Sincronizado en Render";
            document.getElementById('net-status').style.color = "#00ffcc";
        });

        socket.on('init', (data) => {
            myId = data.id;
            Object.keys(data.players).forEach(id => { if(id !== myId) remotePlayers[id] = data.players[id]; });
        });

        socket.on('newPlayer', (player) => { remotePlayers[player.id] = player; });
        socket.on('playerMoved', (player) => { if(remotePlayers[player.id]) remotePlayers[player.id] = player; });
        socket.on('playerDisconnected', (id) => { delete remotePlayers[id]; });

        function update() {
            if (!gameStarted) return;
            let oldX = localPlayer.x; let oldY = localPlayer.y;
            let speed = 4.5;

            if (keys['w']) localPlayer.y -= speed;
            if (keys['s']) localPlayer.y += speed;
            if (keys['a']) localPlayer.x -= speed;
            if (keys['d']) localPlayer.x += speed;

            localPlayer.x = Math.max(20, Math.min(MAP_SIZE - 20, localPlayer.x));
            localPlayer.y = Math.max(20, Math.min(MAP_SIZE - 20, localPlayer.y));
            
            let radius = 15;
            Object.keys(zones).forEach(k => {
                let z = zones[k];
                if (localPlayer.x + radius > z.x && localPlayer.x - radius < z.x + z.w && localPlayer.y + radius > z.y && localPlayer.y - radius < z.y + z.h) { 
                    localPlayer.x = oldX; localPlayer.y = oldY; 
                }
            });

            let sX = canvas.width / 2; let sY = canvas.height / 2;
            localPlayer.angle = Math.atan2(mouseY - sY, mouseX - sX);

            socket.emit('playerUpdate', { name: localPlayer.name, x: localPlayer.x, y: localPlayer.y, angle: localPlayer.angle, role: localPlayer.role });

            let fugs = localPlayer.role === 'FUGITIVE' ? 1 : 0; let agents = localPlayer.role === 'AGENT' ? 1 : 0;
            let leadHTML = `<div class="leader-row" style="color:#00ffcc;"><span>> ${localPlayer.name}</span></div>`;
            Object.keys(remotePlayers).forEach(id => {
                let rp = remotePlayers[id]; if(rp.role === 'PENDING') return;
                if (rp.role === 'FUGITIVE') fugs++; if (rp.role === 'AGENT') agents++;
                leadHTML += `<div class="leader-row" style="color:${rp.role === 'AGENT' ? '#0055ff' : '#ffcc00'};"><span>${rp.name || "Anon"}</span></div>`;
            });
            document.getElementById('count-fugs').innerText = fugs; document.getElementById('count-agents').innerText = agents;
            document.getElementById('leaderboard-content').innerHTML = leadHTML;
            document.getElementById('hp-fill').style.width = localPlayer.hp + '%';
        }

        function draw() {
            if (!gameStarted) return;
            if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let camX = canvas.width / 2 - localPlayer.x; let camY = canvas.height / 2 - localPlayer.y;
            ctx.save(); ctx.translate(camX, camY);

            ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
            
            Object.keys(zones).forEach(k => {
                let z = zones[k]; ctx.fillStyle = z.color; ctx.fillRect(z.x, z.y, z.w, z.h); // Línea 412 Fix z.w impecable
                ctx.strokeStyle = k === 'comisaria' ? '#0055ff' : '#ff0055'; ctx.lineWidth = 3; ctx.strokeRect(z.x, z.y, z.w, z.h);
                ctx.fillStyle = '#00ffcc'; ctx.font = '12px monospace'; ctx.fillText(z.name.toUpperCase(), z.x + 15, z.y + 25);
            });

            Object.keys(remotePlayers).forEach(id => {
                let p = remotePlayers[id]; if (p.role === 'PENDING') return;
                ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.fillText(p.name, p.x - 20, p.y - 25);
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle); ctx.fillStyle = p.role === 'AGENT' ? '#0055ff' : '#ffcc00'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill(); ctx.restore();
            });

            ctx.fillStyle = '#00ffcc'; ctx.font = '10px monospace'; ctx.fillText(localPlayer.name + " (TÚ)", localPlayer.x - 25, localPlayer.y - 25);
            ctx.save(); ctx.translate(localPlayer.x, localPlayer.y); ctx.rotate(localPlayer.angle); ctx.fillStyle = localPlayer.role === 'AGENT' ? '#0055ff' : '#ffcc00'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill(); ctx.restore();
            ctx.restore();
        }

        function mainLoop() { update(); draw(); requestAnimationFrame(mainLoop); }
        mainLoop();
    </script>
</body>
</html>
